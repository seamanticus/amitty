version: "2"
linters:
  default: none
  enable:
    - exhaustive
  settings:
    exhaustive:
      check:
        - switch
        - mapliteral
      # Enum sentinels (unexported <type>Count) are not cases.
      ignore-constants:
        - '\.[a-z][A-Za-z0-9]*Count$'
      # Flag sets are not enums.
      # Discord wire types (IDs, channel/message types, statuses) arrive in JSON with values dmwire does not list, so default: is the right handling; see TODO.md.
      ignore-types:
        - 'Flags$'
        - '^github\.com/seamanticus/amitty/internal/dmwire/discord\.'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
