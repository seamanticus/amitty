name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  build:
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners
        os:
          [
            # Binaries built on the x64 ubuntu-26.04 image require x86-64-v3 (AVX2), so they do not start on older CPUs.
            ubuntu-24.04,
            ubuntu-24.04-arm,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check that generated files are up to date
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          go generate ./internal/config ./pkg/discordemoji
          git diff --exit-code docs/config.md pkg/discordemoji

      - name: Test
        run: |
          go test -race -v ./...
          go test -race -v -tags no_syntax_highlighting ./...

      - name: Build
        run: go build -trimpath -ldflags=-s ./cmd/discordo

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        with:
          name: discordo_${{ runner.os }}_${{ runner.arch }}
          path: discordo
