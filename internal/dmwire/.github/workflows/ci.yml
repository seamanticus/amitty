name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check that generated files are up to date
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          go generate ./...
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      # Integration tests need a Discord token and skip without one.
      - name: Test
        run: go test -race ./...
